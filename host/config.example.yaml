# Template. Copy to config.yaml and edit that; config.yaml is not tracked by
# git, so your own coordinates and button commands stay off GitHub.
#   Windows: copy host\config.example.yaml host\config.yaml
#   macOS:   cp host/config.example.yaml host/config.yaml
# Changes are reloaded automatically by the running host service.
update_seconds: 60
online_refresh_minutes: 10

weather:
  # Beijing city centre
  latitude: 39.9042
  longitude: 116.4074
  # Shown under the clock. Keep it short enough for the 400 px page.
  region: BEIJING - CHINA

news:
  topic: technology
  language: en-US
  country: US
  edition: US:en
  # Set this to any RSS URL to replace Google News. Leave empty to use the topic above.
  rss_url: ""

# Shell commands run when the board reports a button, with RLCD_EVENT and
# RLCD_PAGE in the environment. Leave empty to ignore that button. Navigation
# on the board happens either way.
# Example: boot_hold: "osascript -e 'set volume output muted true'"
buttons:
  key: ""
  key_hold: ""
  boot: ""
  boot_hold: ""

# Added to the measured microphone level to reach an approximate SPL. Raise or
# lower it until the board agrees with a reference meter; no reflash needed.
noise_offset_db: 87

# Name shown on the board for this machine. Empty uses the host name.
device_name: "PC"
# How often to send while the board is showing a different machine. The board
# wakes this one immediately when you switch to it.
hidden_update_seconds: 300

# Reminders. The board shows a box over the current page and rings the speaker
# until a button is pressed. Times are local. Each entry uses one of:
#   at: "09:30"        with optional days: [weekdays] / [mon, wed, fri] / [weekends]
#   every: "45m"       with optional between: "09:00-18:00"
#   countdown: "25m"   with optional from: "14:00"; edit the file to restart it
alerts: []
#  - title: "STAND-UP"
#    at: "09:30"
#    days: [weekdays]
#  - title: "STRETCH"
#    every: "45m"
#    between: "09:00-18:00"
#  - title: "POMODORO"
#    countdown: "25m"

# Shown on the todo page in this order. A due time is "YYYY-MM-DD HH:MM", or
# "HH:MM" for today; the board shows the time left and rings once it is due.
todos: []
#  - text: "Ship the release"
#    due: "2026-09-15 18:00"
#  - text: "Water the plants"
