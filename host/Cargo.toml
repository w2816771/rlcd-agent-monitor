[package]
name = "rlcd-host"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
btleplug = "0.11"
chrono = "0.4"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rss = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
urlencoding = "2"
uuid = "1"
walkdir = "2"

[target."cfg(windows)".dependencies]
tray-icon = "0.25.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
