# Changes are reloaded automatically by the running host service.
update_seconds: 60
online_refresh_minutes: 10

weather:
  # Beijing city centre
  latitude: 39.9042
  longitude: 116.4074
  # Shown under the clock. Keep it short enough for the 400 px page.
  region: BEIJING - CHINA

news:
  topic: technology
  language: en-US
  country: US
  edition: US:en
  # Set this to any RSS URL to replace Google News. Leave empty to use the topic above.
  rss_url: ""

# Shell commands run when the board reports a button, with RLCD_EVENT and
# RLCD_PAGE in the environment. Leave empty to ignore that button. Navigation
# on the board happens either way.
# Example: boot_hold: "osascript -e 'set volume output muted true'"
buttons:
  key: ""
  key_hold: ""
  boot: ""
  boot_hold: ""

# Added to the measured microphone level to reach an approximate SPL. Raise or
# lower it until the board agrees with a reference meter; no reflash needed.
noise_offset_db: 87

# Name shown on the board for this machine. Empty uses the host name.
device_name: "PC"
# How often to send while the board is showing a different machine. The board
# wakes this one immediately when you switch to it.
hidden_update_seconds: 300
